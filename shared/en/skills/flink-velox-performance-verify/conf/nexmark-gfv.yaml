#==============================================================================
# Fixed GFV benchmark conf — managed by the flink-velox-performance-verify
# skill. run-perf.sh swaps this file in as $NEXMARK_HOME/conf/nexmark.yaml
# for the duration of a run and restores the original afterwards. Single
# suite on purpose: a query defined in two suites aborts the benchmark.
#==============================================================================

#==============================================================================
# Rest & web frontend
#==============================================================================

# The metric reporter server host.
nexmark.metric.reporter.host: localhost
# The metric reporter server port.
nexmark.metric.reporter.port: 9098

#==============================================================================
# Benchmark workload configuration (events.num)
#==============================================================================

nexmark.workload.suite.gfv.events.num: 100000000
nexmark.workload.suite.gfv.tps: 50000000
nexmark.workload.suite.gfv.queries: "q0,q1,q2,q3,q4,q5,q7,q8,q9,q10,q11,q12,q13,q14,q15,q16,q17,q18,q19,q20,q21,q22,q23"
nexmark.workload.suite.gfv.warmup.duration: 120s
nexmark.workload.suite.gfv.warmup.events.num: 100000000
nexmark.workload.suite.gfv.warmup.tps: 50000000

#==============================================================================
# Flink REST
#==============================================================================

flink.rest.address: localhost
flink.rest.port: 8081
